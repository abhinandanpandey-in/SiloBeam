[package]
name = "lan-core"
version = "0.1.0"
edition = "2021"

[dependencies]
snow = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
mdns-sd = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
