<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SiloBeam</title>
  <style>
    :root { --bg: #0b0d10; --panel: #13171d; --border: #232a35; --text: #e6edf3; --muted: #7d8590; --accent: #3fb950; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', Consolas, monospace; height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--panel); gap: 8px; }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
    .hdr-right { display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 11px; color: var(--accent); border: 1px solid #234729; background: #102114; padding: 3px 8px; border-radius: 4px; }
    main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card-body { white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.5; flex: 1; }
    .meta { font-size: 10px; color: var(--muted); margin-top: 6px; }
    .btn { background: #1c222b; color: var(--text); border: 1px solid var(--border); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 11px; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .composer { padding: 12px 14px; border-top: 1px solid var(--border); background: var(--panel); display: flex; gap: 8px; }
    textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: inherit; font-size: 13px; resize: none; height: 44px; outline: none; }
    textarea:focus { border-color: var(--accent); }
    .send-btn { background: var(--accent); color: #0b0d10; border: none; padding: 0 16px; border-radius: 6px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .modal h3 { font-size: 13px; color: var(--accent); }
    #qr-box { background: #0b0d10; padding: 10px; border: 1px solid var(--border); border-radius: 6px; }
    #pair-status { font-size: 11px; color: var(--accent); min-height: 16px; }
    .row { display: flex; gap: 8px; width: 100%; justify-content: center; }
    body.mobile header { padding-top: max(40px, env(safe-area-inset-top)); }
    body.mobile .composer { padding-bottom: max(18px, env(safe-area-inset-bottom)); }
  </style>
</head>
<body>
  <header>
    <div class="brand">SILOBEAM</div>
    <div class="hdr-right">
      <div class="badge" id="peer-badge">0 PEERS</div>
      <button class="btn" id="open-pair">PAIR</button>
      <button class="btn" id="open-about">INFO</button>
    </div>
  </header>
  <div id="xfer-bar" style="display:none;padding:8px 14px;background:#102114;border-bottom:1px solid #234729;font-size:11px;color:#3fb950;"></div>
  <main id="feed"></main>
  <div class="composer">
    <input type="file" id="file-picker" style="display:none" />
    <button class="btn" id="pick-file" style="padding:0 12px;">+ FILE</button>
    <textarea id="input" placeholder="Drop a link, OTP, or note..."></textarea>
    <button class="send-btn" id="send">DROP</button>
  </div>

  <div class="modal-bg" id="pair-modal">
    <div class="modal">
      <h3 id="modal-title">QR PAIRING (60s)</h3>
      <div id="qr-box"></div>
      <div id="pair-status"></div>
      <div class="row">
        <button class="send-btn" style="padding:8px 16px;display:none;" id="scan-btn">SCAN LAPTOP QR</button>
        <button class="btn" id="close-pair">CLOSE</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="about-modal">
    <div class="modal" style="text-align:left;align-items:stretch;gap:10px;">
      <h3 style="text-align:center;">BUILT BY ABHINANDAN PANDEY</h3>
      <div style="font-size:12px;color:var(--text);line-height:1.5;">
        AI Security Researcher &amp; Systems Engineer.
      </div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:11px;line-height:1.7;color:var(--muted);">
        <div><span style="color:var(--accent);">STACK:</span> Rust &bull; Tauri &bull; Noise_IK E2EE &bull; mDNS</div>
        <div><span style="color:var(--accent);">MODEL:</span> 100% Offline, Zero-Cloud, Local-First</div>
        <div><span style="color:var(--accent);">GITHUB:</span> github.com/abhinandanpandey-in</div>
        <div><span style="color:var(--accent);">WEB:</span> abhinandanpandey-in-github-io.pages.dev</div>
      </div>
      <div class="row" style="margin-top:4px;">
        <button class="btn" id="copy-gh">COPY GITHUB</button>
        <button class="btn" id="close-about">CLOSE</button>
      </div>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const feed = document.getElementById('feed');
    const input = document.getElementById('input');
    const peerBadge = document.getElementById('peer-badge');
    const modal = document.getElementById('pair-modal');
    const qrBox = document.getElementById('qr-box');
    const scanBtn = document.getElementById('scan-btn');
    const pairStatus = document.getElementById('pair-status');

    let isMobile = false;

    async function init() {
      const info = await invoke('get_device_info');
      isMobile = info.is_mobile;
      if (isMobile) document.body.classList.add('mobile');
      peerBadge.textContent = `${info.peer_count} PEERS`;

      await listen('peers-updated', (e) => (peerBadge.textContent = `${e.payload} PEERS`));
      await listen('note-received', () => refresh());
      await listen('paired-success', (e) => {
        pairStatus.textContent = `Paired with ${e.payload}!`;
        setTimeout(() => modal.classList.remove('open'), 1200);
      });

      await refresh();
    }

    async function refresh() {
      const notes = await invoke('list_notes');
      feed.innerHTML = '';
      for (const n of notes) {
        const card = document.createElement('div');
        card.className = 'card';
        const left = document.createElement('div');
        left.style.flex = '1';
        const body = document.createElement('div');
        body.className = 'card-body';
        body.textContent = n.content;
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${n.kind.toUpperCase()} | ${n.sender_id} | ${new Date(n.created_at * 1000).toLocaleTimeString()}`;
        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn';
        if (n.kind === 'file_meta' && n.content.startsWith('Saved: ') && !isMobile) {
          const filePath = n.content.replace(/^Saved: /, '').replace(/ \(\d+ bytes\)$/, '');
          copyBtn.textContent = 'OPEN';
          copyBtn.onclick = () => invoke('open_file', { path: filePath });
        } else {
          copyBtn.textContent = 'COPY';
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(n.content);
            copyBtn.textContent = 'COPIED';
            setTimeout(() => (copyBtn.textContent = 'COPY'), 1200);
          };
        }
        left.append(body, meta);
        card.append(left, copyBtn);
        feed.append(card);
      }
    }

    async function submit() {
      const val = input.value.trim();
      if (!val) return;
      await invoke('add_note', { content: val, ttlHours: 24 });
      input.value = '';
      await refresh();
    }

    document.getElementById('send').onclick = submit;
    input.addEventListener('keydown', (e) => { if (e.ctrlKey && e.key === 'Enter') submit(); });

    document.getElementById('open-pair').onclick = async () => {
      pairStatus.textContent = '';
      modal.classList.add('open');
      if (isMobile) {
        qrBox.style.display = 'none';
        scanBtn.style.display = 'inline-block';
        pairStatus.textContent = 'Open PAIR on your Laptop, then tap SCAN.';
      } else {
        scanBtn.style.display = 'none';
        qrBox.style.display = 'block';
        try {
          const qr = await invoke('generate_pairing_qr');
          qrBox.innerHTML = qr.svg;
          pairStatus.textContent = 'Scan this QR from your phone (valid 60s)';
        } catch (err) {
          pairStatus.textContent = `Error: ${err}`;
        }
      }
    };

    scanBtn.onclick = async () => {
      try {
        pairStatus.textContent = 'Checking camera permission...';
        const perm = await invoke('plugin:barcode-scanner|check_permissions');
        if (perm.camera !== 'granted') {
          const req = await invoke('plugin:barcode-scanner|request_permissions');
          if (req.camera !== 'granted') {
            pairStatus.textContent = 'Camera permission denied. Enable it in App Settings.';
            return;
          }
        }
        pairStatus.textContent = 'Opening camera...';
        const scanned = await invoke('plugin:barcode-scanner|scan', {
          windowed: false,
          formats: ['QR_CODE']
        });
        const res = await invoke('complete_qr_pairing', { qrRaw: scanned.content });
        pairStatus.textContent = res;
        setTimeout(() => modal.classList.remove('open'), 1200);
      } catch (err) {
        const msg = typeof err === 'string' ? err : JSON.stringify(err);
        pairStatus.textContent = `Scan error: ${msg}`;
      }
    };

    const aboutModal = document.getElementById('about-modal');
    document.getElementById('open-about').onclick = () => aboutModal.classList.add('open');
    document.getElementById('close-about').onclick = () => aboutModal.classList.remove('open');
    document.getElementById('copy-gh').onclick = (e) => {
      navigator.clipboard.writeText('https://github.com/abhinandanpandey-in');
      e.target.textContent = 'COPIED';
      setTimeout(() => (e.target.textContent = 'COPY GITHUB'), 1200);
    };

    document.getElementById('close-pair').onclick = () => modal.classList.remove('open');
    const xferBar = document.getElementById('xfer-bar');
    const filePicker = document.getElementById('file-picker');

    document.getElementById('pick-file').onclick = () => filePicker.click();

    function bytesToB64(bytes) {
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    filePicker.onchange = async () => {
      const file = filePicker.files[0];
      if (!file) return;
      filePicker.value = '';
      try {
        xferBar.style.display = 'block';
        xferBar.textContent = `Starting ${file.name}...`;
        const transferId = await invoke('start_file_transfer', {
          filename: file.name,
          fileSize: file.size
        });

        const CHUNK = 256 * 1024; // 256KB IPC slices
        let offset = 0;
        while (offset < file.size) {
          const slice = file.slice(offset, offset + CHUNK);
          const buf = new Uint8Array(await slice.arrayBuffer());
          await invoke('send_file_chunk', {
            transferId,
            chunkB64: bytesToB64(buf)
          });
          offset += buf.length;
          const pct = Math.min(100, Math.round((offset * 100) / file.size));
          xferBar.textContent = `Sending ${file.name}: ${pct}%`;
        }

        await invoke('finish_file_transfer', { transferId });
        xferBar.textContent = `Sent ${file.name} (100%)`;
        setTimeout(() => (xferBar.style.display = 'none'), 2500);
        await refresh();
      } catch (err) {
        xferBar.textContent = `Transfer error: ${err}`;
        setTimeout(() => (xferBar.style.display = 'none'), 4000);
      }
    };

    listen('transfer-progress', (e) => {
      const { name, pct } = e.payload;
      xferBar.style.display = 'block';
      xferBar.textContent = `Receiving ${name}: ${pct}%`;
      if (pct >= 100) setTimeout(() => (xferBar.style.display = 'none'), 2500);
    });

    init();
  </script>
</body>
</html>
